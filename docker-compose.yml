services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evidence_store
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The blob store behind the images in a test log. versitygw serves the S3 API
  # over a plain directory, so this is the same code path a deployment against
  # S3 takes -- only the endpoint and the credentials differ.
  blobs:
    image: versity/versitygw:v1.11.0
    environment:
      ROOT_ACCESS_KEY: evidence
      ROOT_SECRET_KEY: evidence-secret
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: ":9000"
      VGW_HEALTH: /health
      VGW_WEBUI_PORT: ":9001"
      VGW_WEBUI_NO_TLS: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - blobdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      blobs:
        condition: service_healthy
    environment:
      EVIDENCE_DATABASE_URL: postgres://evidence:evidence@db:5432/evidence_store?sslmode=disable
      EVIDENCE_LISTEN_ADDR: ":8000"
      EVIDENCE_BLOB_BACKEND: s3
      EVIDENCE_BLOB_S3_ENDPOINT: blobs:9000
      EVIDENCE_BLOB_S3_BUCKET: evidence-blobs
      EVIDENCE_BLOB_S3_ACCESS_KEY: evidence
      EVIDENCE_BLOB_S3_SECRET_KEY: evidence-secret
    ports:
      - "8000:8000"

volumes:
  pgdata:
  blobdata:
