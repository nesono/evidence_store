services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evidence_store
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The blob store behind the images in a test log. MinIO speaks S3, so this is
  # the same code path a deployment against S3 takes -- only the endpoint and
  # the credentials differ.
  blobs:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evidence
      MINIO_ROOT_PASSWORD: evidence-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - blobdata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      blobs:
        condition: service_healthy
    environment:
      EVIDENCE_DATABASE_URL: postgres://evidence:evidence@db:5432/evidence_store?sslmode=disable
      EVIDENCE_LISTEN_ADDR: ":8000"
      EVIDENCE_BLOB_BACKEND: s3
      EVIDENCE_BLOB_S3_ENDPOINT: blobs:9000
      EVIDENCE_BLOB_S3_BUCKET: evidence-blobs
      EVIDENCE_BLOB_S3_ACCESS_KEY: evidence
      EVIDENCE_BLOB_S3_SECRET_KEY: evidence-secret
    ports:
      - "8000:8000"

volumes:
  pgdata:
  blobdata:
