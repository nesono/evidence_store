name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...

      # Pinned to a release built against the Go version go.mod targets. That
      # pinning is the point: the linters installed on developer machines were
      # built against an older Go and silently refused to load this module at
      # all, so nobody was running static analysis anywhere (#125).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: go test ./internal/... -v -count=1

  # The web UI ships as plain ES modules with no build step, so its testable
  # parts — the date arithmetic behind the range picker — run under node's own
  # test runner. No dependencies, no package.json, nothing to install.
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run frontend unit tests
        run: node --test web/tests/*_test.mjs

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: go test ./tests/ -v -count=1 -timeout 5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -o evidence-store ./cmd/server

  # adapters/bazel is a separate Go module excluded via .bazelignore, so the
  # jobs above never touch it. Build it the way the BCR presubmit does.
  bazel-adapter:
    name: Bazel Adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/bazel
    steps:
      - uses: actions/checkout@v6
      - name: Build and test adapter
        run: bazel test //...

      # The adapter is a separate Go module, so the root module's lint job never
      # touches it and .golangci.yml at the repo root does not apply. Without
      # this it is the one part of the tree nothing lints (#142).
      #
      # This job builds with Bazel and so has no Go of its own; the linter needs
      # one to load the packages with.
      - uses: actions/setup-go@v6
        with:
          go-version-file: adapters/bazel/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: adapters/bazel
      - name: Verify consumer-facing build resolves without dev dependencies
        run: bazel build --ignore_dev_dependency //cmd/evidence-bazel
