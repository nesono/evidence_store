name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: go test ./internal/... -v -count=1

  # The web UI ships as plain ES modules with no build step, so its testable
  # parts — the date arithmetic behind the range picker — run under node's own
  # test runner. No dependencies, no package.json, nothing to install.
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run frontend unit tests
        run: node --test web/tests/*_test.mjs

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: go test ./tests/ -v -count=1 -timeout 5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binary
        run: go build -o evidence-store ./cmd/server

  # adapters/bazel is a separate Go module excluded via .bazelignore, so the
  # jobs above never touch it. Build it the way the BCR presubmit does.
  bazel-adapter:
    name: Bazel Adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/bazel
    steps:
      - uses: actions/checkout@v6
      - name: Build and test adapter
        run: bazel test //...
      - name: Verify consumer-facing build resolves without dev dependencies
        run: bazel build --ignore_dev_dependency //cmd/evidence-bazel
