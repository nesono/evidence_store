# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    # web/static/pico.min.css is vendored third-party CSS and is kept
    # byte-identical to what upstream publishes, so that the sha256 recorded in
    # the README means something. A whitespace fixer editing it would make the
    # file we ship differ from the file anyone can download and compare.
    { id = "trailing-whitespace", exclude = "^web/static/pico\\.min\\.css$" },
    { id = "end-of-file-fixer", exclude = "^web/static/pico\\.min\\.css$" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "check-merge-conflict" },

]

[[repos]]
repo = "https://github.com/TekWizely/pre-commit-golang"
rev = "v1.0.0-rc.1"
hooks = [
    { id = "go-fmt-repo" },
    { id = "go-vet-repo-mod" },
    { id = "go-build-repo-mod" },
]
