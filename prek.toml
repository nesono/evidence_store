# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    # web/static/app.css is excluded from the whitespace fixers: it is generated
    # by `npm run build:css`, and CI fails if the committed copy differs from a
    # fresh build. Tailwind emits no trailing newline, so a fixer adding one
    # would put the two permanently out of step and leave that check red for
    # ever.
    { id = "trailing-whitespace", exclude = "^web/static/app\\.css$" },
    { id = "end-of-file-fixer", exclude = "^web/static/app\\.css$" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "check-merge-conflict" },

]

[[repos]]
repo = "https://github.com/TekWizely/pre-commit-golang"
rev = "v1.0.0-rc.1"
hooks = [
    { id = "go-fmt-repo" },
    { id = "go-vet-repo-mod" },
    { id = "go-build-repo-mod" },
]
